name: Build BetterRTP

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build
        run: mvn clean package --batch-mode

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BetterRTP
          path: target/*.jar
          if-no-files-found: error
